services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp" # only needed for DHCP
      - "8080:80/tcp"
    environment:
      TZ: "Europe/Berlin"
      WEBPASSWORD_FILE=pihole_password
    volumes:
      - "./etc-pihole:/etc/pihole"
      - "./etc-dnsmasq.d:/etc/dnsmasq.d"
    # cap_add: # only needed for DHCP
    #  - NET_ADMIN
    restart: unless-stopped
    secrets:
      pihole_password:
        file: ./pihole_password.txt
